[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "wildcat-mesh"
version = "2.0.0a1"
description = "Wildcat Mesh — The Den: BBS, telemetry, observatory and (soon) meshd/brain for a Meshtastic LoRa mesh on a Raspberry Pi"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "GPL-3.0-only" }
dependencies = [
    "tomli>=2.0; python_version < '3.11'",
]

[project.optional-dependencies]
# Everything the three Pi services need. `pip install -e '.[den]'` on the Pi.
den = [
    "meshtastic==2.7.4",
    "pypubsub",
    "requests",
    "flask==3.1.3",
    "flask-socketio==5.7.2",
    "python-socketio==5.18.1",
    "werkzeug>=3.1.9",          # floors so `pip install -e .[den]` on the Pi also upgrades these (2026-11-07 security fixes)
    "urllib3>=2.8.0",
    "apscheduler==3.10.4",
    "simple-websocket>=1.0",   # real WebSockets for Flask-SocketIO in threading mode
]
dev = ["pytest>=7"]

[project.scripts]
wildcat = "wildcat.cli:main"

[tool.setuptools]
packages = ["wildcat"]

[tool.pytest.ini_options]
testpaths = ["tests"]
