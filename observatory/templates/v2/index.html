<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b0f14">
<title>Wildcat Mesh · The Den</title>
<link rel="stylesheet" href="{{ url_for('static', filename='vendor/leaflet/leaflet.css') }}">
<link rel="stylesheet" href="{{ url_for('static', filename='v2/app.css') }}">
</head>
<body>
<div id="map" aria-label="Live mesh map"></div>

<header class="glass topbar">
  <div class="brand">
    <span class="mark" aria-hidden="true"></span>
    <div>
      <div class="title">Wildcat Mesh</div>
      <div class="sub">The Den · Observatory</div>
    </div>
  </div>
  <div class="stats">
    <div class="stat"><span class="v" id="s-heard">–</span><span class="l">heard 1h</span></div>
    <div class="stat"><span class="v" id="s-map">–</span><span class="l">on map</span></div>
    <div class="stat"><span class="v" id="s-nodes">–</span><span class="l">nodes</span></div>
    <div class="stat"><span class="v" id="s-rate">–</span><span class="l">pkts/min</span></div>
    <div class="stat"><span class="v" id="s-util">–</span><span class="l">ch util</span></div>
  </div>
  <div class="status" id="status" title="bus / radio status">
    <span class="dot" id="dot-bus"></span><span id="status-text">connecting…</span>
  </div>
</header>

<aside class="glass feed" id="feed">
  <div class="feed-head">
    <div class="feed-title">Live<span class="live-dot"></span></div>
    <div class="filters" id="filters">
      <button class="chip on" data-kind="all">all</button>
      <button class="chip" data-kind="text">text</button>
      <button class="chip" data-kind="position">pos</button>
      <button class="chip" data-kind="telemetry">telem</button>
      <button class="chip" data-kind="neighbors">nbrs</button>
      <button class="chip" data-kind="nodeinfo">info</button>
    </div>
  </div>
  <div class="feed-list" id="feed-list"></div>
  <div class="feed-empty" id="feed-empty">Listening on the bus…</div>
</aside>

<section class="glass card" id="card" hidden>
  <button class="close" id="card-close" aria-label="close">×</button>
  <div class="card-head">
    <div class="gauge" id="card-gauge">
      <svg viewBox="0 0 64 64" aria-hidden="true">
        <circle class="g-track" cx="32" cy="32" r="27"/>
        <circle class="g-arc" id="g-arc" cx="32" cy="32" r="27"/>
      </svg>
      <span class="g-short" id="card-short">––</span>
    </div>
    <div class="card-title">
      <div class="card-name" id="card-long">–</div>
      <div class="card-id"><span id="card-id">–</span><span class="proto" id="card-proto"></span></div>
      <div class="card-heard"><i class="pulse-dot" id="card-pulse"></i><span id="c-heard">–</span><span class="dim" id="c-hops"></span></div>
    </div>
  </div>
  <div class="card-grid">
    <div><span class="k">SNR</span><span class="v" id="c-snr">–</span><svg class="spark" id="sp-snr" viewBox="0 0 120 28" preserveAspectRatio="none"></svg></div>
    <div><span class="k">RSSI</span><span class="v" id="c-rssi">–</span><svg class="spark" id="sp-rssi" viewBox="0 0 120 28" preserveAspectRatio="none"></svg></div>
    <div><span class="k">battery</span><span class="v" id="c-batt">–</span><div class="batt"><i id="c-batt-bar"></i></div><svg class="spark" id="sp-batt" viewBox="0 0 120 28" preserveAspectRatio="none"></svg></div>
  </div>
  <div class="card-meta">
    <span><b id="c-hw">–</b><em>hardware</em></span>
    <span><b id="c-role">–</b><em>role</em></span>
    <span><b id="c-pkts">–</b><em>pkts 24h</em></span>
    <span><b id="c-util">–</b><em>ch util</em></span>
  </div>
  <div class="card-foot"><span id="c-pos"></span><button class="mini" id="c-center" title="center map">⌖ center</button></div>
</section>

<div class="glass layers" id="layers">
  <label class="lay"><input type="checkbox" id="cov-on"> <span>Coverage</span><span class="hint">measured RX points</span></label>
  <div class="lay-sub" id="cov-opts" hidden>
    <label class="lay"><input type="checkbox" id="cov-direct" checked> <span>heard direct only</span></label>
    <label class="lay"><input type="checkbox" id="cov-bins" checked> <span>hex bins (≥3 samples)</span></label>
    <div class="cov-scale"><i style="background:#ff6b6b"></i>&lt;−8<i style="background:#ff9a5c"></i>−8…−3<i style="background:#f2c04e"></i>−3…3<i style="background:#b6e05a"></i>3…8<i style="background:#58e39c"></i>&gt;8 dB</div>
    <div class="cov-summary" id="cov-summary">loading…</div>
  </div>
</div>

<div class="glass legend" id="legend">
  <span><i class="sw base"></i>this node</span>
  <span><i class="sw on"></i>&lt; 15 min</span>
  <span><i class="sw warm"></i>&lt; 1 h</span>
  <span><i class="sw cold"></i>older</span>
  <span><i class="sw link"></i>heard directly</span>
</div>

<script src="{{ url_for('static', filename='vendor/leaflet/leaflet.js') }}"></script>
<script src="{{ url_for('static', filename='vendor/socket.io.min.js') }}"></script>
<script src="{{ url_for('static', filename='v2/app.js') }}"></script>
</body>
</html>
